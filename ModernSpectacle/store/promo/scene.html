<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Modern Spectacle promo</title>
<!-- A 15 s promo, 1920×1080. render(t) draws the frame at t seconds, so render.mjs can step through it frame by frame. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05060d; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  #stage { position: absolute; inset: 0; overflow: hidden; }
  #wallpaper { position: absolute; inset: -40px;
    background:
      radial-gradient(1100px 700px at 18% 22%, #3b2a8f 0%, transparent 60%),
      radial-gradient(900px 700px at 85% 75%, #0f5d8c 0%, transparent 62%),
      radial-gradient(700px 500px at 70% 10%, #7a2d6b 0%, transparent 60%),
      linear-gradient(160deg, #0b0d24, #070814); }
  #menubar { position: absolute; left: 0; right: 0; top: 0; height: 34px; background: rgba(20, 22, 40, 0.45);
    backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 18px; gap: 22px; font-size: 15px;
    font-weight: 600; color: rgba(255,255,255,0.88); z-index: 50; }
  #menubar .spacer { flex: 1; }
  #menubar .light { font-weight: 500; color: rgba(255,255,255,0.7); }

  .win { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
    will-change: left, top, width, height, opacity; }
  .bar { height: 36px; display: flex; align-items: center; padding: 0 14px; gap: 8px; font-size: 14px; font-weight: 600; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .bar .title { flex: 1; text-align: center; margin-right: 60px; opacity: 0.75; white-space: nowrap; overflow: hidden; }
  .body { position: absolute; top: 36px; left: 0; right: 0; bottom: 0; overflow: hidden; }

  .dark { background: #1d1f2b; color: #d7dbff; } .dark .bar { background: #262938; }
  .term { background: #0d0f14; color: #b6f5c3; } .term .bar { background: #1b1d24; color: #ccc; }
  .light { background: #f7f8fb; color: #222; } .light .bar { background: #e9ebf1; }
  .notesw { background: #fff8d9; color: #3d3510; } .notesw .bar { background: #f1e6b8; }
  .musicw { background: linear-gradient(160deg, #2a1240, #10101a); color: #fff; } .musicw .bar { background: rgba(255,255,255,0.06); }

  .line { height: 12px; border-radius: 6px; margin: 13px 0 0 0; }
  .code { padding: 10px 22px; font-family: "SF Mono", Menlo, monospace; }
  .code .row { display: flex; align-items: center; gap: 10px; height: 25px; }
  .code .ln { width: 26px; font-size: 12px; color: #5a5f7d; text-align: right; }
  .code .tok { height: 11px; border-radius: 5px; }
  .termtext { padding: 14px 20px; font-family: "SF Mono", Menlo, monospace; font-size: 17px; line-height: 27px; white-space: pre; }
  .tabs { display: flex; gap: 6px; padding: 8px 12px 0; background: #e9ebf1; }
  .tab { height: 28px; border-radius: 8px 8px 0 0; padding: 0 16px; font-size: 13px; display: flex; align-items: center; background: #dfe2ea; color: #555; }
  .tab.on { background: #f7f8fb; color: #222; }
  .page { padding: 26px 34px; }
  .hero { height: 150px; border-radius: 14px; background: linear-gradient(120deg, #5b8cff, #a86bff); margin-bottom: 18px; }
  .chat { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .bub { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 20px; }
  .bub.in { background: #e6e8ef; align-self: flex-start; } .bub.out { background: #3b7cff; color: #fff; align-self: flex-end; }
  .mailrow { display: flex; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #e3e5ec; align-items: center; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; }
  .art { width: 140px; height: 140px; border-radius: 14px; background: linear-gradient(135deg, #ff6aa2, #7b5cff 60%, #24d3ff); margin: 22px auto 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.4); }

  /* Overlays */
  .caption { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); text-align: center; z-index: 80; white-space: nowrap; }
  .caption .big { font-size: 72px; font-weight: 800; letter-spacing: -1.5px; text-shadow: 0 8px 40px rgba(0,0,0,0.65); }
  .caption .small { margin-top: 10px; font-size: 30px; font-weight: 500; color: rgba(255,255,255,0.78); text-shadow: 0 4px 20px rgba(0,0,0,0.7); }
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; z-index: 70;
    background: linear-gradient(to top, rgba(4,5,14,0.88), rgba(4,5,14,0.55) 45%, transparent); }

  #keys { position: absolute; left: 50%; top: 640px; transform: translateX(-50%); display: flex; gap: 18px; z-index: 85; }
  .key { width: 104px; height: 104px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 600; color: #fff; background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
    border: 1px solid rgba(255,255,255,0.28); backdrop-filter: blur(18px); box-shadow: 0 10px 0 rgba(0,0,0,0.35), 0 24px 50px rgba(0,0,0,0.45); }
  .key.down { background: linear-gradient(180deg, rgba(120,170,255,0.55), rgba(80,120,255,0.35)); border-color: rgba(170,200,255,0.8);
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 0 40px rgba(110,160,255,0.65); }
  .gap { width: 46px; }

  #hud { position: absolute; left: 50%; top: 150px; width: 620px; height: 430px; margin-left: -310px; border-radius: 34px; z-index: 82;
    background: rgba(26, 30, 56, 0.42); backdrop-filter: blur(30px) saturate(1.6); border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 40px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25); }
  #hud .screen { position: absolute; left: 50px; top: 48px; width: 520px; height: 292px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.18); }
  #hud .blk { position: absolute; border-radius: 9px; }
  #hud .label { position: absolute; left: 0; right: 0; top: 362px; text-align: center; font-size: 26px; font-weight: 700; }
  #hud .sub { position: absolute; left: 0; right: 0; top: 396px; text-align: center; font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.7); }
  #ring { position: absolute; inset: -3px; border-radius: 36px; padding: 3px; pointer-events: none;
    background: conic-gradient(from var(--a), #6aa8ff, #b77bff, #4ff0d0, #6aa8ff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; }

  #devices { position: absolute; inset: 0; z-index: 75; display: flex; align-items: center; justify-content: center; gap: 70px; padding-bottom: 170px; }
  .device { position: relative; }
  .device .frame { position: relative; border-radius: 16px; border: 3px solid rgba(255,255,255,0.55); background: rgba(10,12,30,0.55); backdrop-filter: blur(12px); }
  .device .dl { text-align: center; margin-top: 22px; font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.88); }
  .device .blk { position: absolute; border-radius: 8px; }

  #end { position: absolute; inset: 0; z-index: 95; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(900px 600px at 50% 40%, #1d2560, #05060d 70%); }
  #end img { width: 230px; height: 230px; filter: drop-shadow(0 30px 60px rgba(60,110,255,0.55)); }
  #end .name { margin-top: 34px; font-size: 104px; font-weight: 800; letter-spacing: -3px; }
  #end .tag { margin-top: 12px; font-size: 38px; font-weight: 500; color: rgba(255,255,255,0.82); }
  #end .foot { margin-top: 46px; font-size: 24px; font-weight: 600; color: rgba(160,190,255,0.9); letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="stage">
  <div id="wallpaper"></div>
  <div id="menubar"><span>◆</span><span>Modern Spectacle</span><span class="light">File</span><span class="light">Edit</span><span class="light">View</span><span class="spacer"></span><span class="light">⌘</span><span class="light">Wed 9:41 AM</span></div>
  <div id="windows"></div>
  <div class="scrim" id="scrim"></div>
  <div id="hud"><div id="ring"></div><div class="screen" id="hudscreen"></div><div class="label" id="hudlabel"></div><div class="sub" id="hudsub"></div></div>
  <div id="keys"></div>
  <div class="caption" id="caption"><div class="big" id="capbig"></div><div class="small" id="capsmall"></div></div>
  <div id="devices"></div>
  <div id="end"><img src="icon.png" alt=""><div class="name">Modern Spectacle</div>
    <div class="tag">One keystroke. Every window in its place.</div>
    <div class="foot">macOS 14 or later&nbsp;&nbsp;·&nbsp;&nbsp;store.alvumo.xyz/app/modern-spectacle</div></div>
</div>

<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = (k, s = 1.25) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
// A spring that settles with one small overshoot: windows "snap" into place.
const spring = k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.exp(-6 * k) * Math.cos(7.5 * k) * (1 - k);
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerpRect = (a, b, k) => ({ x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), w: lerp(a.w, b.w, k), h: lerp(a.h, b.h, k) });

// ---------- windows ----------
const G = 12, TOP = 46, W = 1920, H = 1080;
const full = { x: G, y: TOP, w: W - 2 * G, h: H - TOP - G };
const colW = (W - 3 * G) / 2, rowH = (H - TOP - 2 * G) / 2;

const layouts = {
  messy: {
    editor: { x: 190, y: 150, w: 980, h: 640 }, terminal: { x: 840, y: 430, w: 700, h: 430 },
    browser: { x: 1010, y: 110, w: 820, h: 600 }, chat: { x: 90, y: 520, w: 520, h: 470 },
    mail: { x: 560, y: 650, w: 620, h: 380 }, notes: { x: 1390, y: 610, w: 460, h: 420 }, music: { x: 1290, y: 70, w: 420, h: 300 },
  },
  // Main · Two on the right
  A: { editor: { x: G, y: TOP, w: 1136, h: full.h }, terminal: { x: 1160, y: TOP, w: 748, h: 503 }, browser: { x: 1160, y: TOP + 503 + G, w: 748, h: full.h - 503 - G } },
  // Grid
  C: { editor: { x: G, y: TOP, w: colW, h: rowH }, terminal: { x: 2 * G + colW, y: TOP, w: colW, h: rowH },
       browser: { x: G, y: TOP + rowH + G, w: colW, h: rowH }, chat: { x: 2 * G + colW, y: TOP + rowH + G, w: colW, h: rowH } },
};
// Bring to Main from the grid: the terminal takes main, the editor takes its place.
layouts.D = { ...layouts.C, editor: layouts.C.terminal, terminal: layouts.C.editor };

const ids = ['music', 'browser', 'editor', 'mail', 'terminal', 'chat', 'notes']; // back to front when messy

function bar(title) {
  return `<div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">${title}</span></div>`;
}
function codeBody() {
  const colors = ['#c792ea', '#82aaff', '#c3e88d', '#ffcb6b', '#89ddff', '#f78c6c', '#7f85a8'];
  let rows = '';
  for (let i = 1; i <= 46; i++) {
    const indent = [0, 0, 24, 24, 48, 48, 72][Math.floor(rand() * 7)];
    let toks = `<span style="width:${indent}px"></span>`;
    const n = 1 + Math.floor(rand() * 4);
    for (let j = 0; j < n; j++) toks += `<span class="tok" style="width:${40 + Math.floor(rand() * 160)}px;background:${colors[Math.floor(rand() * colors.length)]};opacity:.85"></span>`;
    rows += `<div class="row"><span class="ln">${i}</span>${toks}</div>`;
  }
  return `<div class="code">${rows}</div>`;
}
function termBody() {
  return `<div class="termtext"><span style="color:#7aa2ff">~/work/app</span> <span style="color:#fff">❯</span> swift build
Building for debugging...
[42/42] Linking App
<span style="color:#fff">Build complete!</span> (3.21s)
<span style="color:#7aa2ff">~/work/app</span> <span style="color:#fff">❯</span> swift test
✔ Test run with 62 tests passed
<span style="color:#7aa2ff">~/work/app</span> <span style="color:#fff">❯</span> git push
To github.com:you/app.git
   b1e5ba0..f2d1fff  main -> main
<span style="color:#7aa2ff">~/work/app</span> <span style="color:#fff">❯</span> <span style="background:#b6f5c3">&nbsp;</span></div>`;
}
function browserBody() {
  let lines = '';
  for (let i = 0; i < 14; i++) lines += `<div class="line" style="width:${55 + Math.floor(rand() * 45)}%;background:#d9dce6"></div>`;
  return `<div class="tabs"><div class="tab on">API Reference</div><div class="tab">Guide</div><div class="tab">Issues</div></div>
    <div class="page"><div class="hero"></div><div class="line" style="width:40%;height:22px;background:#2b2f3a"></div>${lines}</div>`;
}
function chatBody() {
  const msgs = [['in', 'Is the build green?'], ['out', 'Yes, all 62 tests pass'], ['in', 'Ship it 🚀'], ['out', 'Releasing 0.3.2 now'], ['in', 'Nice. Demo at 3?'], ['out', 'See you there']];
  return `<div class="chat">${msgs.map(([d, m]) => `<div class="bub ${d}">${m}</div>`).join('')}</div>`;
}
function mailBody() {
  const cs = ['#ff8a65', '#4fc3f7', '#aed581', '#ba68c8', '#ffd54f', '#4db6ac'];
  return cs.map(c => `<div class="mailrow"><div class="avatar" style="background:${c}"></div><div style="flex:1">
    <div class="line" style="margin:0;width:${40 + Math.floor(rand() * 30)}%;background:#3a3f4b;height:11px"></div>
    <div class="line" style="margin:8px 0 0;width:${60 + Math.floor(rand() * 35)}%;background:#cfd3dd"></div></div></div>`).join('');
}
function notesBody() {
  let l = '<div style="padding:18px 22px"><div class="line" style="width:55%;height:20px;background:#6b5a14;margin:0 0 10px"></div>';
  for (let i = 0; i < 12; i++) l += `<div class="line" style="width:${50 + Math.floor(rand() * 48)}%;background:#d8c983"></div>`;
  return l + '</div>';
}
function musicBody() {
  return `<div class="art"></div><div style="text-align:center;font-weight:700;font-size:16px">Night Drive</div>
    <div style="margin:14px auto 0;width:70%;height:5px;border-radius:3px;background:rgba(255,255,255,.2)"><div style="width:42%;height:100%;border-radius:3px;background:#fff"></div></div>`;
}
const specs = {
  editor: ['dark', 'main.swift — App', codeBody], terminal: ['term', 'zsh — ~/work/app', termBody],
  browser: ['light', 'API Reference', browserBody], chat: ['light', 'Messages', chatBody], mail: ['light', 'Inbox — 6 unread', mailBody],
  notes: ['notesw', 'Notes', notesBody], music: ['musicw', 'Music', musicBody],
};
const els = {};
for (const id of ids) {
  const [cls, title, body] = specs[id];
  const d = document.createElement('div');
  d.className = 'win ' + cls;
  d.innerHTML = bar(title) + `<div class="body">${body()}</div>`;
  document.getElementById('windows').appendChild(d);
  els[id] = d;
}

// ---------- keys, HUD, devices ----------
const keysEl = document.getElementById('keys');
function setKeys(labels, down, opacity, scale = 1) {
  const html = labels.map((l, i) => l === '|' ? '<div class="gap"></div>' : `<div class="key ${down[i] ? 'down' : ''}" style="transform:translateY(${down[i] ? 7 : 0}px)">${l}</div>`).join('');
  if (keysEl.innerHTML !== html) keysEl.innerHTML = html;
  keysEl.style.opacity = opacity;
  keysEl.style.transform = `translateX(-50%) scale(${scale})`;
}

const templates = {
  A: { title: 'Main · Two on the right', blocks: [[0, 0, 0.6, 1, 'main'], [0.6, 0, 0.4, 0.5], [0.6, 0.5, 0.4, 0.5]] },
  B: { title: 'Two columns', blocks: [[0, 0, 0.5, 1, 'main'], [0.5, 0, 0.5, 1], [0.5, 0, 0.5, 1, 'hide']] },
  C: { title: 'Grid', blocks: [[0, 0, 0.5, 0.5, 'main'], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]] },
};
const hudScreen = document.getElementById('hudscreen');
const hudBlocks = [0, 1, 2, 3].map(() => { const b = document.createElement('div'); b.className = 'blk'; hudScreen.appendChild(b); return b; });
function blockStyle(el, r, kind, sw, sh, pad, alpha) {
  const g = pad;
  el.style.left = (r[0] * sw + g) + 'px'; el.style.top = (r[1] * sh + g) + 'px';
  el.style.width = Math.max(0, r[2] * sw - 2 * g) + 'px'; el.style.height = Math.max(0, r[3] * sh - 2 * g) + 'px';
  const main = kind === 'main';
  el.style.background = main ? 'linear-gradient(140deg, rgba(110,165,255,0.95), rgba(140,110,255,0.85))' : 'rgba(255,255,255,0.32)';
  el.style.boxShadow = main ? '0 0 30px rgba(110,160,255,0.6), inset 0 1px 0 rgba(255,255,255,0.6)' : 'inset 0 1px 0 rgba(255,255,255,0.45)';
  el.style.opacity = alpha;
}
function drawHud(from, to, k, appear) {
  const a = templates[from], b = templates[to];
  for (let i = 0; i < 4; i++) {
    const ra = a.blocks[i] || [0.5, 0.5, 0, 0, 'hide'], rb = b.blocks[i] || [0.5, 0.5, 0, 0, 'hide'];
    const r = [0, 1, 2, 3].map(j => lerp(ra[j], rb[j], k));
    const alphaA = ra[4] === 'hide' ? 0 : 1, alphaB = rb[4] === 'hide' ? 0 : 1;
    // Blocks fly in one after another when the HUD first appears.
    const stagger = clamp((appear - i * 0.12) / 0.5);
    blockStyle(hudBlocks[i], r, (k < 0.5 ? ra[4] : rb[4]), 520, 292, 6, lerp(alphaA, alphaB, k) * easeOutCubic(stagger));
    hudBlocks[i].style.transform = `scale(${lerp(0.6, 1, easeOutBack(stagger))})`;
  }
  document.getElementById('hudlabel').textContent = k < 0.5 ? a.title : b.title;
}

const devicesEl = document.getElementById('devices');
const deviceDefs = [
  ['Laptop', 330, 206, [[0, 0, 0.6, 1, 'main'], [0.6, 0, 0.4, 0.5], [0.6, 0.5, 0.4, 0.5]]],
  ['Monitor', 420, 236, [[0, 0, 0.5, 0.5, 'main'], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]]],
  ['Ultrawide', 620, 266, [[0, 0, 0.25, 1], [0.25, 0, 0.5, 1, 'main'], [0.75, 0, 0.25, 0.5], [0.75, 0.5, 0.25, 0.5]]],
];
const devEls = deviceDefs.map(([name, w, h, blocks]) => {
  const d = document.createElement('div'); d.className = 'device';
  d.innerHTML = `<div class="frame" style="width:${w}px;height:${h}px"></div><div class="dl">${name}</div>`;
  const frame = d.querySelector('.frame');
  const bs = blocks.map(r => { const b = document.createElement('div'); b.className = 'blk'; frame.appendChild(b); return [b, r]; });
  devicesEl.appendChild(d);
  return { d, w, h, bs };
});

// ---------- captions ----------
const captions = [
  [0.35, 2.15, 'Too many windows?', 'Every app, everywhere, all at once.'],
  [2.45, 4.9, 'Hold ⌃⌥⌘. Press M.', 'A preview appears while Jev ranks your windows.'],
  [5.35, 7.05, 'Arranged by what you’re doing.', 'Your work in front. The rest waits neatly behind.'],
  [7.35, 9.85, 'Press M again.', 'Switch layouts before you let go.'],
  [10.05, 11.55, '⌃⌥⌘↩  Bring to Main', 'Any window, center stage, instantly.'],
  [11.85, 13.05, 'Every screen.', 'Laptop, monitor and ultrawide layouts built in.'],
];
const capEl = document.getElementById('caption'), capBig = document.getElementById('capbig'), capSmall = document.getElementById('capsmall');

// ---------- the timeline ----------
// Each change of layout: windows in both layouts move; a window that joins grows in at its slot; a window that leaves
// shrinks and fades where it is.
const stages = [
  { from: 'messy', to: 'A', start: 5.0, length: 0.85, ease: spring },
  { from: 'A', to: 'C', start: 9.0, length: 0.75, ease: spring },
  { from: 'C', to: 'D', start: 10.35, length: 0.65, ease: easeInOutCubic },
];
function windowState(id, t) {
  const ph = ids.indexOf(id);
  const m = layouts.messy[id];
  const drift = { x: m.x + Math.sin(t * 0.9 + ph) * 10, y: m.y + Math.cos(t * 0.7 + ph * 1.7) * 8, w: m.w, h: m.h };
  const rectIn = (name) => name === 'messy' ? drift : layouts[name][id];
  let state = { r: drift, opacity: 1, scale: 1 };
  for (const st of stages) {
    if (t < st.start) break;
    const delay = st.from === 'messy' ? ph * 0.035 : 0;
    const raw = prog(t, st.start + delay, st.start + delay + st.length);
    const k = st.ease(raw);
    const a = rectIn(st.from), b = rectIn(st.to);
    if (a && b) state = { r: lerpRect(a, b, k), opacity: 1, scale: 1 };
    else if (b) state = { r: b, opacity: easeOutCubic(raw), scale: lerp(0.85, 1, easeOutBack(raw)) };
    else if (a) state = { r: a, opacity: 1 - easeOutCubic(raw), scale: lerp(1, 0.9, easeOutCubic(raw)) };
    else state = { r: drift, opacity: 0, scale: 1 };
  }
  if (t >= 10.35 && (id === 'terminal' || id === 'editor')) {
    // The swap travels along an arc, so the two windows pass each other instead of overlapping.
    const kD = easeInOutCubic(prog(t, 10.35, 11.0));
    state.r = { ...state.r, y: state.r.y - Math.sin(kD * Math.PI) * (id === 'terminal' ? 60 : -60) };
  }
  return state;
}
function zOrder(id, t) {
  if (t < 5.0) return ids.indexOf(id) + 1;
  if (t >= 10.35 && id === 'terminal') return 30; // the promoted window comes to the front
  return (layouts[t >= 9 ? 'C' : 'A'][id] ? 20 : 2) + ids.indexOf(id);
}

window.render = function (t) {
  // Windows pop in at the start.
  for (const id of ids) {
    const el = els[id], { r, opacity, scale } = windowState(id, t), i = ids.indexOf(id);
    const pop = easeOutBack(prog(t, 0.05 + i * 0.07, 0.5 + i * 0.07), 1.6);
    el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; el.style.height = r.h + 'px';
    el.style.zIndex = zOrder(id, t);
    const focusDim = t >= 10.0 && t < 10.35 && id === 'terminal' ? 1 : 0;
    el.style.boxShadow = focusDim ? '0 0 0 4px rgba(120,170,255,0.95), 0 30px 80px rgba(0,0,0,0.55)' : '';
    el.style.opacity = opacity * clamp(pop * 1.4);
    el.style.transform = `scale(${lerp(0.82, 1, pop) * scale})`;
  }

  // Desktop recedes for the "every screen" shot and the end card.
  const recede = easeInOutCubic(prog(t, 11.6, 12.1));
  document.getElementById('windows').style.filter = `blur(${recede * 14}px) brightness(${1 - recede * 0.55})`;
  document.getElementById('windows').style.transform = `scale(${1 - recede * 0.06})`;

  // Keys.
  const held1 = t >= 2.3 && t < 5.0, mDown1 = t >= 3.0 && t < 3.3;
  const held2 = t >= 7.3 && t < 9.0, mDown2 = (t >= 7.7 && t < 7.95) || (t >= 8.4 && t < 8.65);
  const held3 = t >= 10.05 && t < 10.6, retDown = t >= 10.3 && t < 10.55;
  let keysOpacity = 0;
  if (t >= 2.2 && t < 5.4) keysOpacity = prog(t, 2.2, 2.45) * (1 - prog(t, 5.0, 5.4));
  if (t >= 7.2 && t < 9.4) keysOpacity = prog(t, 7.2, 7.4) * (1 - prog(t, 9.0, 9.4));
  if (t >= 9.95 && t < 11.0) keysOpacity = prog(t, 9.95, 10.1) * (1 - prog(t, 10.6, 11.0));
  if (t >= 9.95 && t < 11.0) setKeys(['⌃', '⌥', '⌘', '|', '↩'], [held3, held3, held3, false, retDown], keysOpacity, 0.9);
  else setKeys(['⌃', '⌥', '⌘', '|', 'M'], [held1 || held2, held1 || held2, held1 || held2, false, mDown1 || mDown2], keysOpacity, 0.9);

  // HUD: first preview (A), then cycling A → B → C.
  const hud = document.getElementById('hud'), ring = document.getElementById('ring');
  let hudOpacity = 0, hudScale = 1, appear = 1, from = 'A', to = 'A', k = 0;
  if (t >= 3.05 && t < 5.4) {
    const inK = easeOutBack(prog(t, 3.05, 3.5), 1.4), outK = easeInOutCubic(prog(t, 5.0, 5.4));
    hudOpacity = clamp(prog(t, 3.05, 3.3)) * (1 - outK); hudScale = lerp(0.7, 1, inK) * lerp(1, 0.6, outK);
    appear = prog(t, 3.2, 4.0) * 1.6;
  } else if (t >= 7.45 && t < 9.4) {
    const inK = easeOutBack(prog(t, 7.45, 7.75), 1.4), outK = easeInOutCubic(prog(t, 9.0, 9.4));
    hudOpacity = clamp(prog(t, 7.45, 7.6)) * (1 - outK); hudScale = lerp(0.8, 1, inK) * lerp(1, 0.6, outK);
    if (t < 8.4) { from = 'A'; to = 'B'; k = easeInOutCubic(prog(t, 7.75, 8.1)); } else { from = 'B'; to = 'C'; k = easeInOutCubic(prog(t, 8.45, 8.8)); }
  }
  hud.style.opacity = hudOpacity; hud.style.transform = `scale(${hudScale})`;
  drawHud(from, to, k, appear);
  const ranking = t >= 3.05 && t < 4.0;
  ring.style.opacity = ranking ? 1 : clamp(1 - prog(t, 4.0, 4.4)) * (t < 5 ? 1 : 0);
  ring.style.setProperty('--a', `${(t * 360) % 360}deg`);
  document.getElementById('hudsub').textContent = t < 4.0 ? 'Jev is ranking 7 windows…' : (t < 5.4 ? 'Ranked in 0.19 s · release to apply' : 'Release to apply');

  // Captions with a lift-and-fade.
  const cap = captions.find(c => t >= c[0] && t < c[1]);
  if (cap) {
    const inK = easeOutCubic(prog(t, cap[0], cap[0] + 0.35)), outK = prog(t, cap[1] - 0.25, cap[1]);
    capBig.textContent = cap[2]; capSmall.textContent = cap[3];
    capEl.style.opacity = inK * (1 - outK);
    capEl.style.transform = `translateX(-50%) translateY(${(1 - inK) * 30}px)`;
  } else capEl.style.opacity = 0;
  document.getElementById('scrim').style.opacity = cap ? 1 : 0.6;

  // Devices.
  const devOn = t >= 11.75 && t < 13.2;
  devicesEl.style.opacity = devOn ? prog(t, 11.75, 12.0) * (1 - prog(t, 12.95, 13.2)) : 0;
  devEls.forEach((dv, i) => {
    const k = easeOutBack(prog(t, 11.8 + i * 0.16, 12.3 + i * 0.16), 1.5);
    dv.d.style.transform = `translateY(${(1 - k) * 80}px) scale(${lerp(0.8, 1, k)})`;
    dv.bs.forEach(([b, r], j) => {
      const kb = easeOutCubic(prog(t, 12.0 + i * 0.16 + j * 0.07, 12.35 + i * 0.16 + j * 0.07));
      blockStyle(b, r, r[4], dv.w - 6, dv.h - 6, 5, kb);
      b.style.transform = `scale(${lerp(0.5, 1, kb)})`;
    });
  });

  // End card.
  const end = document.getElementById('end');
  const ek = prog(t, 13.05, 13.45);
  end.style.opacity = ek;
  end.querySelector('img').style.transform = `scale(${lerp(0.5, 1, easeOutBack(prog(t, 13.15, 13.75), 1.6))}) rotate(${lerp(-12, 0, easeOutCubic(prog(t, 13.15, 13.75)))}deg)`;
  end.querySelector('.name').style.opacity = prog(t, 13.4, 13.75);
  end.querySelector('.name').style.transform = `translateY(${(1 - easeOutCubic(prog(t, 13.4, 13.8))) * 26}px)`;
  end.querySelector('.tag').style.opacity = prog(t, 13.65, 14.0);
  end.querySelector('.foot').style.opacity = prog(t, 13.9, 14.25);
};
render(Number(new URLSearchParams(location.search).get('t') || 0));
</script>
</body>
